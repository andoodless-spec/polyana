name: Распаковать обновлённый проект

on:
  workflow_dispatch:

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v4

      - name: Распаковать ZIP
        run: |
          mkdir -p polyanka-updated
          unzip -o polyanka-updated-2026-10-28.zip -d polyanka-updated

      - name: Сохранить распакованный проект
        uses: actions/upload-artifact@v4
        with:
          name: polyanka-updated
          path: polyanka-updated/