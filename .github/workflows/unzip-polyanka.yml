name: Unpack latest Polyanka update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack and publish update
        shell: bash
        run: |
          set -euo pipefail
          ZIP=polyanka-final-update-2026-10-28.zip
          if [ ! -f $ZIP ]; then ZIP=polyanka-update-no-delete-2026-10-28.zip; fi
          if [ ! -f $ZIP ]; then ZIP=polyanka-updated-2026-10-28.zip; fi
          if [ ! -f $ZIP ]; then
            echo PROJECT_ZIP_NOT_FOUND_IN_REPOSITORY_ROOT
            exit 1
          fi
          echo USING_ARCHIVE_$ZIP
          DEST=$RUNNER_TEMP/polyanka-project
          mkdir -p $DEST
          unzip 