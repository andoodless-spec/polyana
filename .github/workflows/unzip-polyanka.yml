name: Распаковать полянку

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unpack-polyanka-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unpack:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Скачать выбранную ветку
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Распаковать ZIP в корень
        shell: bash
