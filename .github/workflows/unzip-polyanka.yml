          total = 0

          with zipfile.ZipFile(archive) as z:
              entries = z.infolist()
              if len(entries) > 5000:
                  raise SystemExit("Слишком много файлов в ZIP.")

              for item in entries:
                  if item.is_dir():
                      continue

                  path = PurePosixPath(item.filename)

                  if (
                      path.is_absolute()
                      or ".." in path.parts
                      or "\\" in item.filename
                      or not path.parts
                      or any(ord(c) < 32 for c in item.filename)
