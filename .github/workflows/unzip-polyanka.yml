name: Apply Polyanka project ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-zip:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Unpack updated project into repository
        shell: bash
        run: |
          set -euo pipefail
          archive="polyanka-updated-2026-10-28.zip"
          test -f "$archive" || { echo "Missing $archive in repository root"; exit 1; }
          tmp="$(mktemp -d)"
          unzip -q "$archive" -d "$tmp"
          cp -a "$tmp"/. .
          rm -rf "$tmp"

      - name: Commit updated project files
        shell: bash
        run: |
          set -euo pipefail
          git config 