name: Apply Polyanka update without deleting files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Overlay updated project files
        shell: bash
        run: |
          set -euo pipefail
          extracted="$(mktemp -d "$RUNNER_TEMP/polyanka-update.XXXXXX")"
          if [ -f "polyanka-update-no-delete-2026-10-28.zip" ]; then
            archive="polyanka-update-no-delete-2026-10-28.zip"
            unzip -q "$archive" -d "$extracted"
          elif [ -f "polyanka-updated-2026-10-28.zip" ]; then
            archive="polyanka-updated-2026-10-28.zip"
            unzip -q "$archive" -d "$extracted"
