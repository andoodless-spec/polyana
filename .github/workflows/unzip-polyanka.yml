name: Unpack Polyanka update (simple)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="polyanka-final-update-2026-10-28.zip"
          if [ ! -f "$ZIP" ]; then ZIP="polyanka-update-no-delete-2026-10-28.zip"; fi
          if [ ! -f "$ZIP" ]; then ZIP="polyanka-updated-2026-10-28.zip"; fi
          if [ ! -f "$ZIP" ]; then
            echo "Project ZIP was not found in the repository root."
            exit 1
          fi
          echo "Unpacking: $ZIP"
          DEST="$RUNNER_TEMP/polyanka-project"
          mkdir -p "$DEST"
          unzip -q "$ZIP" -d "$DEST"
          cp -a "$DEST/." .

